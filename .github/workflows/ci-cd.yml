name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Linting and validation
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Lint
        run: npm run lint

      # Optional: Add backend testing if tests are added in the future
      # - name: Install Backend Dependencies
      #   run: |
      #     cd backend
      #     npm ci
      # - name: Run Backend Tests
      #   run: |
      #     cd backend
      #     npm test

  # Job 2: Build and verify Docker images locally
  docker-verify:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            VITE_API_URL=http://localhost:5000

      - name: Verify Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false

  # Job 3: Build and Publish Docker images to Docker Hub (Triggered only on push to main branch)
  docker-publish:
    runs-on: ubuntu-latest
    needs: docker-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Frontend Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/complaint-portal-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/complaint-portal-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.PRODUCTION_API_URL }}

      # Build and push Backend Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/complaint-portal-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/complaint-portal-backend:${{ github.sha }}

  # Job 4: Deployment step (Placeholder for cloud hosting, e.g., Render or AWS)
  deploy:
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy status notification
        run: |
          echo "Docker images successfully pushed. Ready for deployment."
          # Example of calling a webhook to deploy on Render:
          # curl -X POST ${{ secrets.RENDER_DEPLOY_WEBHOOK_URL }}
